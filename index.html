<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion locative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barre de navigation sombre à gauche, zone de travail claire à droite ; résumé chiffré avant le détail. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16212e; --muted:#5b6878; --line:#d5dbe3;
  --nav:#12283a; --nav-ink:#dfe8ef; --nav-muted:#8fa5b6;
  --accent:#0d7a6b; --accent-ink:#ffffff;
  --ok:#1c7c44; --warn:#a86200; --crit:#b3261e;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e161e; --surface:#16212c; --ink:#e6edf3; --muted:#93a1b0; --line:#2a3846;
    --nav:#0a1118; --nav-ink:#dfe8ef; --nav-muted:#7f93a3;
    --accent:#3cc0a8; --accent-ink:#06231e;
    --ok:#5fcf8a; --warn:#f0b24a; --crit:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e161e; --surface:#16212c; --ink:#e6edf3; --muted:#93a1b0; --line:#2a3846;
  --nav:#0a1118; --nav-ink:#dfe8ef; --nav-muted:#7f93a3;
  --accent:#3cc0a8; --accent-ink:#06231e;
  --ok:#5fcf8a; --warn:#f0b24a; --crit:#ff8a80;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

nav{background:var(--nav);color:var(--nav-ink);width:220px;flex:none;display:flex;flex-direction:column;gap:4px;padding:20px 12px;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:18px;padding:0 10px 4px}
.brand small{display:block;font:400 12px var(--body);color:var(--nav-muted);margin-top:2px;overflow-wrap:anywhere}
.brand img{display:block;width:100%;max-width:180px;background:#fff;border-radius:8px;padding:6px;margin-bottom:10px}
.navgroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-muted);padding:14px 10px 4px}
nav a{color:var(--nav-ink);text-decoration:none;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
nav a:hover{background:color-mix(in srgb,var(--nav-ink) 10%,transparent)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav a .n{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}

main{flex:1;min-width:0;overflow:auto;padding:24px clamp(16px,3vw,36px) 48px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.status:empty{display:none}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 8px;font-size:13px}
.btn.danger{color:var(--crit)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font:700 22px var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.crit{border-left:4px solid var(--crit)} .tile.ok{border-left:4px solid var(--ok)} .tile.warn{border-left:4px solid var(--warn)}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.panel>header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel .body{padding:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:13px;color:var(--muted)}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.pill.mute{color:var(--muted)}

.chart{display:flex;gap:10px;align-items:flex-end;height:190px;padding-top:22px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;width:100%;max-width:64px;position:relative;border-bottom:1px solid var(--line)}
.chart .due{position:absolute;left:0;right:0;bottom:0;border:1px dashed var(--muted);border-bottom:0;border-radius:4px 4px 0 0}
.chart .got{position:absolute;left:4px;right:4px;bottom:0;background:var(--accent);border-radius:3px 3px 0 0}
.chart .col.now .got{background:var(--ok)}
.chart .val{position:absolute;left:-12px;right:-12px;text-align:center;font-size:11px;color:var(--muted);transform:translateY(-16px);white-space:nowrap}
.chart .lab{font-size:12px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.inline,input.inline{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;max-width:100%}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(8,14,20,.55)}
dialog form,dialog .box{padding:18px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}

.recu{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--bg)}
.recu .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:12px}
.logoDoc{display:block;width:150px;background:#fff;border-radius:6px;padding:4px;margin-bottom:8px}
.contrat .logoDoc{width:190px;margin:0 auto 10px}
#login .logoDoc{width:200px;margin:0 auto 4px;padding:0}
.recu dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.recu dt{color:var(--muted);font-size:13px}.recu dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.recu .amount{margin-top:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.recu .amount b{font:700 20px var(--display);display:block}
.recu .amount span{font-size:13px;color:var(--muted)}

dialog.wide{width:min(780px,calc(100vw - 32px))}
.contrat{border:1px solid var(--line);border-radius:6px;padding:20px;background:var(--bg);max-height:58vh;overflow:auto;font-size:14px}
.contrat h2{text-align:center;margin-bottom:14px}
.contrat h3{font:600 14px var(--body);margin:14px 0 4px}
.contrat p{margin:0 0 8px;max-width:70ch}
.contrat .sig{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;color:var(--muted)}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--bg)}
.avatar.ini{display:flex;align-items:center;justify-content:center;font:700 34px var(--display);color:var(--accent)}
.avatar.sm{width:56px;height:56px}
.photoRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photoRow input{flex:1;min-width:0}
.owner{display:flex;gap:18px;padding:16px;flex-wrap:wrap;align-items:flex-start}
.owner .info{flex:1;min-width:220px}
.owner dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:10px 0 0}
.owner dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.owner dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
:root{--c-blue:#1f5fbf;--c-green:#1c7c44;--c-violet:#6a3fb5;--c-orange:#b85c00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-blue:#7fb0ff;--c-green:#5fcf8a;--c-violet:#b79cff;--c-orange:#f0a94a}}
:root[data-theme="dark"]{--c-blue:#7fb0ff;--c-green:#5fcf8a;--c-violet:#b79cff;--c-orange:#f0a94a}
.v-proprietaires .owner{background:linear-gradient(120deg,var(--nav),color-mix(in srgb,var(--accent) 45%,var(--nav)));color:var(--nav-ink);border-color:transparent}
.v-proprietaires .owner dt{color:var(--nav-ink);opacity:.72}
.v-proprietaires .owner p{color:var(--nav-ink) !important;opacity:.8}
.v-proprietaires .owner .avatar{border:3px solid var(--nav-ink);background:color-mix(in srgb,var(--nav-ink) 14%,transparent)}
.v-proprietaires .owner .avatar.ini{color:var(--nav-ink)}
.v-proprietaires .tile{--c:var(--c-blue);background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,var(--surface));border-top:4px solid var(--c)}
.v-proprietaires .tile .k{color:var(--c);font-weight:600}
.v-proprietaires .tile .v{color:var(--c)}
.v-proprietaires .tile:nth-child(2){--c:var(--c-green)}
.v-proprietaires .tile:nth-child(3){--c:var(--c-violet)}
.v-proprietaires .tile:nth-child(4){--c:var(--c-orange)}
.v-proprietaires .tile:nth-child(5){background:var(--accent);border-color:var(--accent)}
.v-proprietaires .tile:nth-child(5) .k,.v-proprietaires .tile:nth-child(5) .v,.v-proprietaires .tile:nth-child(5) .s{color:var(--accent-ink)}
.v-proprietaires .panel:not(.owner)>header{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:8px 8px 0 0;border-bottom:2px solid var(--accent)}
.v-proprietaires th{background:color-mix(in srgb,var(--c-blue) 8%,var(--surface));color:var(--c-blue)}
.v-proprietaires tr:nth-child(odd) td{background:color-mix(in srgb,var(--c-blue) 4%,var(--surface))}
.v-proprietaires td.num b{color:var(--c-green)}
tr.apt td:first-child{padding-left:34px}
#view tr.villa td{font-weight:700;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-top:2px solid var(--accent)}
#view tr.total td{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-top:1px solid var(--accent)}
#view tr.grand td{font-weight:700;background:var(--nav);color:var(--nav-ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);display:none;z-index:9}

/* écran de connexion */
body.locked>nav,body.locked>main{display:none}
#login{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(140deg,var(--nav),color-mix(in srgb,var(--accent) 50%,var(--nav)))}
body.locked #login{display:flex}
#login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
#login h1{font-size:22px}
#login p{margin:0;color:var(--muted);font-size:14px}
#login .err{font-size:13px;color:var(--crit);min-height:18px}
#login .foot2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.navfoot{margin-top:auto;padding-top:14px}
.navfoot button{width:100%;background:transparent;border:1px solid color-mix(in srgb,var(--nav-ink) 30%,transparent);color:var(--nav-ink);padding:8px 10px;border-radius:6px;cursor:pointer}
.navfoot button:hover{background:color-mix(in srgb,var(--nav-ink) 12%,transparent)}
.navfoot small{display:block;color:var(--nav-muted);font-size:11px;margin-bottom:6px;overflow-wrap:anywhere}
@media (max-width:760px){
  body{flex-direction:column}
  .navfoot{margin:0;padding:0}.navfoot small{display:none}.navfoot button{width:auto;white-space:nowrap}
  nav{width:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:4px;overflow-x:auto}
  .brand{font-size:15px;padding:0 8px 0 4px;white-space:nowrap}.brand small,.navgroup,nav a .n{display:none}
  nav a{white-space:nowrap}
  main{overflow:visible;padding-top:16px}
  .two{grid-template-columns:1fr}
  th,td{padding:8px 10px}
}
@media (prefers-reduced-motion:no-preference){.meter i,.chart .got{transition:all .3s}}
</style>
</head>
<body>
<nav aria-label="Navigation principale">
  <div class="brand"><img data-logo alt="Africa Vision Immo">Gestion locative<small id="brandSub"></small></div>
  <div class="navgroup">Tableaux de bord</div>
  <a href="#agence" data-r="agence">Agence</a>
  <a href="#proprietaires" data-r="proprietaires">Propriétaires</a>
  <div class="navgroup">Gestion</div>
  <a href="#biens" data-r="biens">Maisons <span class="n" id="nBiens"></span></a>
  <a href="#locataires" data-r="locataires">Locataires <span class="n" id="nLoc"></span></a>
  <a href="#contrats" data-r="contrats">Contrats de bail</a>
  <a href="#paiements" data-r="paiements">Paiements et reçus</a>
  <a href="#maintenance" data-r="maintenance">Maintenance <span class="n" id="nMnt"></span></a>
  <a href="#parametres" data-r="parametres">Paramètres</a>
  <div class="navfoot" id="navfoot" hidden><small id="whoami"></small><button type="button" id="logout">Se déconnecter</button></div>
</nav>
<div id="login">
  <form id="loginForm" autocomplete="on">
    <img data-logo class="logoDoc" alt="Africa Vision Immo">
    <h1>Gestion locative</h1>
    <p>Espace réservé au personnel de l'agence. Connectez-vous pour accéder aux dossiers.</p>
    <label>Adresse e-mail<input type="email" name="email" required autocomplete="username"></label>
    <label>Mot de passe<input type="password" name="pw" required autocomplete="current-password"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" id="loginBtn">Se connecter</button>
    <div class="foot2"><button type="button" class="btn small" id="forgot">Mot de passe oublié</button><span style="font-size:12px;color:var(--muted)" id="loginHint"></span></div>
  </form>
</div>
<main>
  <div class="status" id="status" role="status"></div>
  <div id="view"></div>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="alert"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";

/* =====================================================================
   1. CONFIGURATION FIREBASE — À REMPLIR UNE SEULE FOIS
   Console Firebase > icône engrenage > Paramètres du projet >
   « Vos applications » > application Web > Configuration du SDK.
   Recopiez les 6 valeurs ci-dessous entre les guillemets.
   Tant que apiKey est vide, la page fonctionne en démonstration
   et rien n'est enregistré.
   ===================================================================== */
const FB={
  apiKey:"AIzaSyA0ejN6rvNra9HNjA9zOuZLdEnjVill-s8",
  authDomain:"gestion-locative-cbec4.firebaseapp.com",
  projectId:"gestion-locative-cbec4",
  storageBucket:"gestion-locative-cbec4.firebasestorage.app",

  appId:"1:112183793210:web:c1c97c4898526566f5c703"
};
/* Toutes les données de cette plateforme sont rangées sous ce document,
   pour ne jamais se mélanger aux autres plateformes du même projet. */
const RACINE=["apps","gestion-locative"];
/* Accès à la plateforme :
   false = accès ouvert, aucune connexion demandée (réglage actuel)
   true  = chaque agent doit se connecter avec son e-mail et son mot de passe.
   Pour passer à true : activer E-mail/Mot de passe dans Firebase > Authentication,
   créer les comptes, et remettre la règle « if request.auth != null » dans Firestore. */

function addMonths(m,k){let[y,mo]=m.split("-").map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+pad(mo)}

const okPhoto=v=>typeof v==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(v);
function shrink(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const z=320,m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=z;
    c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image"))};im.src=url;
})}

/* montant en lettres */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
function b100(n){
  if(n<17)return U[n]; if(n<20)return"dix-"+U[n-10];
  const d=Math.floor(n/10),u=n%10;
  if(d===7)return u===1?"soixante et onze":"soixante-"+b100(10+u);
  if(d===9)return"quatre-vingt-"+b100(10+u);
  const base=["","","vingt","trente","quarante","cinquante","soixante","","quatre-vingt"][d];
  if(u===0)return d===8?"quatre-vingts":base;
  if(u===1&&d!==8)return base+" et un";
  return base+"-"+U[u];
}
function b1000(n){const c=Math.floor(n/100),r=n%100;const s=c===0?"":c===1?"cent":U[c]+" cent"+(r===0?"s":"");return[s,r?b100(r):""].filter(Boolean).join(" ")}
function enLettres(n){
  n=Math.round(Number(n)||0); if(n===0)return"zéro";
  const out=[];const g=[[1e9,"milliard"],[1e6,"million"]];
  for(const[v,w]of g){const x=Math.floor(n/v);if(x){out.push(b1000(x)+" "+w+(x>1?"s":""));n%=v}}
  const k=Math.floor(n/1000);if(k){out.push(k===1?"mille":b1000(k).replace(/(cents|vingts)$/,m=>m.slice(0,-1))+" mille");n%=1000}
  if(n)out.push(b1000(n));
  return out.join(" ");
}

/* ---------- calculs ---------- */
const due=(l,m)=>!!l.debut&&l.debut.slice(0,7)<=m&&(l.actif!==false?true:(!!l.fin&&l.fin.slice(0,7)>=m));
const paid=(locId,m)=>list("paiements").filter(p=>p.locataireId===locId&&p.mois===m).reduce((s,p)=>s+(+p.montant||0),0);
const tenantOf=bienId=>list("locataires").find(l=>l.bienId===bienId&&l.actif!==false);
function monthTotals(m,bienIds){
  const locs=list("locataires").filter(l=>due(l,m)&&(!bienIds||bienIds.has(l.bienId)));
  const attendu=locs.reduce((s,l)=>s+(+l.loyer||0),0);
  const encaisse=list("paiements").filter(p=>p.mois===m&&(!bienIds||bienIds.has(p.bienId))).reduce((s,p)=>s+(+p.montant||0),0);
  const impaye=locs.reduce((s,l)=>s+Math.max(0,(+l.loyer||0)-paid(l.id,m)),0);
  return{attendu,encaisse,impaye,locs};
}
function payPill(l,m){
  if(!due(l,m))return'<span class="pill mute">Non dû</span>';
  const p=paid(l.id,m),lo=+l.loyer||0;
  if(p>=lo)return'<span class="pill ok">Payé</span>';
  if(p>0)return'<span class="pill warn">Partiel · reste '+esc(money(lo-p))+'</span>';
  return'<span class="pill crit">Impayé</span>';
}
const bienNom=id=>{const b=S.biens[id];if(!b)return"Maison supprimée";const p=S.biens[b.parentId];return(p?p.nom+" › ":"")+b.nom};
const kids=id=>list("biens").filter(b=>b.parentId===id).sort(byName);
const isUnit=b=>!kids(b.id).length||!!tenantOf(b.id);
function groupes(rows){const ids=new Set(rows.map(r=>r.b.id));return rows.filter(r=>!r.b.parentId||!ids.has(r.b.parentId)).map(t=>({t,ch:rows.filter(r=>r.b.parentId===t.b.id)}))}
const hasExemples=()=>COLS.some(c=>list(c).some(d=>d.exemple));

/* ---------- données ---------- */
function errMsg(e){
  const c=e&&e.code;
  if(c==="permission-denied")return"Enregistrement refusé : votre compte n'a pas le droit de modifier ces données.";
  if(c==="unauthenticated")return"Votre session a expiré. Reconnectez-vous.";
  if(c==="resource-exhausted")return"Quota de la base atteint : réessayez plus tard.";
  if(c==="unavailable")return"Pas de connexion : la modification sera envoyée dès le retour du réseau.";
  return"Enregistrement impossible pour le moment. Réessayez dans un instant.";
}
const enLigne=()=>!!(ROOT&&(user||!CONNEXION_REQUISE));
async function put(col,id,data){
  if(enLigne()){try{await ROOT.collection(col).doc(id).set(data)}catch(e){toast(errMsg(e));throw e}}
  else{S[col][id]=data;render()}
}
async function del(col,id){
  if(enLigne()){try{await ROOT.collection(col).doc(id).delete()}catch(e){toast(errMsg(e));throw e}}
  else{delete S[col][id];render()}
}
async function putConfig(data){
  if(enLigne()){try{await ROOT.collection("config").doc("agence").set(data)}catch(e){toast(errMsg(e));throw e}}
  else{S.config={...DEF,...data};render()}
}

/* ---------- connexion ---------- */
function authMsg(e){
  const c=e&&e.code||"";
  if(/invalid-email/.test(c))return"Cette adresse e-mail n'est pas valide.";
  if(/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c))return"E-mail ou mot de passe incorrect.";
  if(/user-disabled/.test(c))return"Ce compte a été désactivé.";
  if(/too-many-requests/.test(c))return"Trop de tentatives. Patientez quelques minutes.";
  if(/network-request-failed/.test(c))return"Pas de connexion internet.";
  if(/operation-not-allowed|configuration-not-found/.test(c))return"La connexion par e-mail n'est pas activée dans la console Firebase.";
  return"Connexion impossible pour le moment. Réessayez.";
}
function verrou(on){
  document.body.classList.toggle("locked",!!on);
  $("#navfoot").hidden=!!on||!user;
  if(!on&&user)$("#whoami").textContent=user.email||"";
}
function ecranConnexion(){
  verrou(true);
  const frm=$("#loginForm"),err=$("#loginErr"),btn=$("#loginBtn");
  if(frm.dataset.ready)return;frm.dataset.ready="1";
  frm.addEventListener("submit",async e=>{
    e.preventDefault();err.textContent="";btn.disabled=true;
    try{await auth.signInWithEmailAndPassword(frm.elements.email.value.trim(),frm.elements.pw.value)}
    catch(ex){err.textContent=authMsg(ex)}
    finally{btn.disabled=false;frm.elements.pw.value=""}
  });
  $("#forgot").onclick=async()=>{
    const m=frm.elements.email.value.trim();
    if(!m){err.textContent="Saisissez d'abord votre adresse e-mail.";return}
    try{await auth.sendPasswordResetEmail(m);err.style.color="var(--ok)";err.textContent="Un lien de réinitialisation vous a été envoyé par e-mail."}
    catch(ex){err.style.color="var(--crit)";err.textContent=authMsg(ex)}
  };
}
function demo(txt){
  ROOT=null;user=null;verrou(false);$("#navfoot").hidden=true;
  $("#status").textContent=txt;render();
}

/* ---------- écoute des données ---------- */
let unsubs=[];
function couper(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];abonne=false}
function ecouter(){
  if(abonne)return;abonne=true;
  const st=$("#status"),got=new Set();
  st.textContent="Connexion aux données…";
  const timer=setTimeout(()=>{st.textContent="Les données ne sont pas joignables pour le moment. L'affichage peut être incomplet."},10000);
  const done=(k,fresh)=>{if(fresh)got.add(k);if(got.size>COLS.length){clearTimeout(timer);st.textContent=""}};
  const fail=e=>{clearTimeout(timer);st.textContent=e&&e.code==="permission-denied"
    ?"Accès refusé par les règles de sécurité de la base. Vérifiez les règles Firestore du projet."
    :"La connexion aux données a été interrompue. Rouvrez la page pour continuer."};
  for(const col of COLS){
    unsubs.push(ROOT.collection(col).onSnapshot(s=>{
      const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S[col]=o;done(col,!s.metadata.fromCache);render();
    },fail));
  }
  unsubs.push(ROOT.collection("config").doc("agence").onSnapshot(s=>{S.config={...DEF,...(s.exists?s.data():{})};done("config",!s.metadata.fromCache);render()},fail));
}

async function init(){
  if(CONNEXION_REQUISE)document.body.classList.add("locked");
  if(!FB.apiKey||!window.firebase){
    demo("Configuration Firebase absente : ce que vous saisissez ici sera perdu à la fermeture. Renseignez le bloc FB en haut du fichier index.html.");
    return;
  }
  try{
    firebase.initializeApp(FB);
    auth=firebase.auth();db=firebase.firestore();
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    ROOT=db.collection(RACINE[0]).doc(RACINE[1]);
  }catch(e){demo("La base de données n'a pas pu être initialisée : vérifiez la configuration Firebase du fichier.");return}
  if(!CONNEXION_REQUISE){verrou(false);$("#navfoot").hidden=true;ecouter();render();return}
  $("#loginHint").textContent=FB.projectId;
  ecranConnexion();
  auth.onAuthStateChanged(u=>{
    user=u||null;
    if(user){verrou(false);ecouter();render()}
    else{couper();for(const c of COLS)S[c]={};S.config={...DEF};$("#status").textContent="";ecranConnexion();render()}
  });
}

    $("#rm-"+f.k).onclick=()=>{photos[f.k]="";pv.hidden=true;pv.removeAttribute("src");frm.elements[f.k].value=""};

function contrat(id){
  const l=S.locataires[id];if(!l||!l.bail)return null;
  const k=l.bail,b=S.biens[l.bienId]||{},p=S.proprietaires[b.proprietaireId]||{},c=S.config;
  const ag=k.bailleur!=="proprietaire",duree=Math.max(1,Math.round(+k.duree||12));
  const coord=(...x)=>x.filter(Boolean).join(", ");
  const parties=[
    "ENTRE LES SOUSSIGNÉS :",
    (p.nom||"Le propriétaire").replace(/\s*\(exemple\)$/,"")+(coord(p.adresse,p.telephone)?", "+coord(p.adresse,p.telephone):"")+(ag?", représenté par "+coord(c.nom,c.adresse,c.telephone)+", agissant en qualité de mandataire":"")+", ci-après dénommé « le Bailleur », d'une part ;",
    "ET : "+coord(l.nom,l.telephone)+(k.identite?", titulaire de la pièce d'identité : "+k.identite:"")+", ci-après dénommé « le Preneur », d'autre part.",
    "Il a été convenu et arrêté ce qui suit :"
  ];
  const payeA=ag?"de l'agence "+c.nom:"du Bailleur";
  const art=[];
  art.push(["Objet","Le Bailleur donne en location au Preneur, qui l'accepte, le bien suivant : "+String(b.type||"bien").toLowerCase()+" « "+bienNom(l.bienId)+" »"+((b.adresse||S.biens[b.parentId]?.adresse)?", situé à "+(b.adresse||S.biens[b.parentId].adresse):"")+". Le bien est loué à usage "+(USAGES[k.usage]||USAGES.habitation)+" exclusivement. Le Preneur déclare l'avoir visité et le connaître."]);
  art.push(["Durée","Le présent bail est conclu pour une durée de "+duree+" mois, à compter du "+dateFr(l.debut)+" pour se terminer le "+dateFr(finBail(l.debut,duree))+". "+(k.renouvellement==="fin"?"À cette date, le bail prend fin de plein droit, sauf nouvel accord écrit entre les parties.":"À défaut de congé donné par l'une des parties dans le délai de préavis prévu ci-dessous, il se renouvelle automatiquement pour la même durée.")]);
  art.push(["Loyer","Le loyer mensuel est fixé à "+somme(l.loyer)+". Il est payable d'avance, au plus tard le "+(Math.round(+k.jour)||5)+" de chaque mois, auprès "+payeA+". Chaque paiement donne lieu à la remise d'un reçu numéroté."]);
  if(+k.caution||+k.avance){
    let t="";
    if(+k.caution)t+="À la signature, le Preneur verse une caution de "+somme(k.caution)+". Elle ne produit pas d'intérêts et lui est restituée à son départ, déduction faite des loyers impayés et du coût des réparations à sa charge. ";
    if(+k.avance)t+="Le Preneur verse également une avance de "+Math.round(k.avance)+" mois de loyer, soit "+somme(k.avance*l.loyer)+", qui s'impute sur les premiers loyers.";
    art.push(["Caution et avance",t.trim()]);
  }
  art.push(["Obligations du Preneur","Le Preneur s'engage à : payer le loyer aux dates convenues ; occuper les lieux paisiblement et selon l'usage prévu ; assurer l'entretien courant et les petites réparations ; régler ses consommations d'eau et d'électricité ; ne pas sous-louer ni céder le bail, et ne faire aucune transformation, sans l'accord écrit du Bailleur ; laisser l'accès au bien pour les travaux nécessaires ; signaler sans délai toute panne ou dégradation ; rendre le bien en bon état à son départ."]);
  art.push(["Obligations du Bailleur","Le Bailleur s'engage à : remettre le bien en bon état d'usage ; garantir au Preneur une jouissance paisible des lieux ; prendre en charge les grosses réparations qui ne résultent pas d'une faute du Preneur."]);
  art.push(["État des lieux","Un état des lieux est dressé en présence des deux parties à l'entrée et à la sortie du Preneur. Il est signé par elles et annexé au présent contrat."]);
  art.push(["Résiliation","Chaque partie peut mettre fin au bail en prévenant l'autre par écrit au moins "+(Math.round(+k.preavis)||3)+" mois à l'avance. En cas de non-paiement du loyer ou de non-respect du présent contrat, et après une mise en demeure écrite restée sans effet, le Bailleur peut résilier le bail."]);
  if(k.particulieres)art.push(["Clauses particulières",k.particulieres]);
  art.push(["Litiges","Les parties s'efforcent de régler à l'amiable tout différend né du présent contrat. À défaut, le litige est porté devant les juridictions compétentes du lieu où se trouve le bien."]);
  return{id,nom:l.nom,titre:"CONTRAT DE BAIL À USAGE "+(USAGES[k.usage]||USAGES.habitation).toUpperCase(),parties,
    articles:art.map(([t,x],i)=>["Article "+(i+1)+" — "+t,x]),
    fin:"Fait à "+k.lieu+", le "+dateFr(k.date)+", en "+(ag?"trois":"deux")+" exemplaires originaux, un pour chaque signataire.",
    sign:["Le Bailleur","Le Preneur"].concat(ag?["L'agence (signature et cachet)"]:[])};
}

function pdfContrat(k){
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),L=20,W=170;let y=24;
  const para=(t,style,size,gap)=>{d.setFont("helvetica",style);d.setFontSize(size);d.splitTextToSize(String(t),W).forEach(line=>{if(y>277){d.addPage();y=22}d.text(line,L,y);y+=size*0.47});y+=gap};
  const LW=44,LH=LW/LOGO_R;
  try{d.addImage(LOGO,"JPEG",(210-LW)/2,10,LW,LH)}catch(e){}
  y=10+LH+9;
  d.setFont("helvetica","bold");d.setFontSize(14);d.text(k.titre,105,y,{align:"center"});y+=5;
  d.setDrawColor(13,122,107);d.setLineWidth(.6);d.line(L,y,L+W,y);y+=10;
  k.parties.forEach((x,i)=>para(x,i===0||i===3?"bold":"normal",10.5,3));
  y+=2;k.articles.forEach(([t,x])=>{if(y>262){d.addPage();y=22}para(t,"bold",10.5,1);para(x,"normal",10.5,4)});
  if(y>235){d.addPage();y=22}
  y+=4;para(k.fin,"normal",10.5,14);
  const w=W/k.sign.length;d.setFontSize(9.5);d.setFont("helvetica","bold");
  k.sign.forEach((s,i)=>{d.text(d.splitTextToSize(s,w-6),L+i*w,y)});
  d.setFont("helvetica","normal");d.setFontSize(8.5);d.setTextColor(110);
  k.sign.forEach((s,i)=>d.text("Lu et approuvé",L+i*w,y+10));
  return d.output("blob");
}

function releve(pid,m){
  const taux=+S.config.commission||0;
  const biens=list("biens").filter(b=>b.proprietaireId===pid).sort(byName);
  const rows=biens.map(b=>{
    const l=list("locataires").find(x=>x.bienId===b.id&&due(x,m))||tenantOf(b.id);
    const enc=list("paiements").filter(p=>p.bienId===b.id&&p.mois===m).reduce((s,p)=>s+(+p.montant||0),0);
    const mnt=list("maintenance").filter(x=>x.bienId===b.id&&(x.aCharge||"proprietaire")==="proprietaire"&&(x.date||"").slice(0,7)===m).reduce((s,x)=>s+(+x.cout||0),0);
    const loyer=l&&due(l,m)?(+l.loyer||0):0,reste=l&&due(l,m)?Math.max(0,loyer-paid(l.id,m)):0;
    return{b,l,enc,mnt,loyer,reste,com:enc*taux/100,net:enc-enc*taux/100-mnt};
  });
  const sum=k=>rows.reduce((s,r)=>s+r[k],0);
  return{rows,enc:sum("enc"),mnt:sum("mnt"),com:sum("com"),net:sum("net"),units:rows.filter(r=>isUnit(r.b)).length,occ:rows.filter(r=>r.l).length};
}

  tops.filter(x=>kids(x.id).length).forEach(x=>{
    const ch=kids(x.id);let tL=0,tP=0,tR=0;
    const rows=ch.map(c=>{const l=tenantOf(c.id),d=l&&due(l,m),lo=d?(+l.loyer||0):0,p=l?paid(l.id,m):0,r=d?Math.max(0,lo-p):0;tL+=lo;tP+=p;tR+=r;
      return'<tr><td>'+esc(c.nom)+'<span class="sub">'+esc(c.type)+"</span></td><td>"+(l?esc(l.nom):'<span class="pill warn">Vacant</span>')+'</td><td class="num">'+esc(money(l?l.loyer:c.loyer))+'</td><td class="num">'+esc(money(p))+'</td><td class="num">'+esc(money(r))+"</td><td>"+(l?payPill(l,m):"—")+"</td>"+acts(c,l?'<button class="btn small primary" data-act="pay" data-id="'+esc(l.id)+'">Encaisser</button>':"")+"</tr>"}).join("");
    h+='<section class="panel"><header><h2>'+esc(x.nom)+" · paiements par appartement · "+esc(moisLabel(m))+'</h2><button class="btn small" data-act="add-bien" data-id="'+esc(x.id)+'">Ajouter un appartement</button></header><div class="scroll"><table><tr><th>Appartement</th><th>Locataire</th><th class="num">Loyer</th><th class="num">Payé</th><th class="num">Reste dû</th><th>État</th><th></th></tr>'+rows+'<tr class="grand"><td colspan="2">Total '+esc(x.nom)+'</td><td class="num">'+esc(money(tL))+'</td><td class="num">'+esc(money(tP))+'</td><td class="num">'+esc(money(tR))+'</td><td colspan="2">'+(tL?Math.round(Math.min(tP,tL)/tL*100)+" % encaissé":"")+"</td></tr></table></div></section>";
  });
  return h;
}
function vLoc(){
  const m=curMonth(),ls=list("locataires").sort((a,b)=>(a.actif===false)-(b.actif===false)||byName(a,b));
  return head("Locataires","État des loyers pour "+esc(moisLabel(m)),'<button class="btn primary" data-act="add-loc">Nouveau locataire</button>')+
  '<section class="panel">'+(ls.length?'<div class="scroll"><table><tr><th>Locataire</th><th>Maison</th><th class="num">Loyer</th><th>Bail</th><th>Ce mois</th><th></th></tr>'+ls.map(l=>"<tr><td>"+esc(l.nom)+'<span class="sub">'+esc(l.telephone)+"</span></td><td>"+esc(bienNom(l.bienId))+'</td><td class="num">'+esc(money(l.loyer))+"</td><td>depuis le "+esc(dateFr(l.debut))+(l.actif===false?'<span class="sub">terminé le '+esc(dateFr(l.fin))+"</span>":"")+"</td><td>"+(l.actif===false?'<span class="pill mute">Bail terminé</span>':payPill(l,m))+'</td><td class="act">'+(l.actif===false?"":'<button class="btn small primary" data-act="pay" data-id="'+esc(l.id)+'">Encaisser</button><button class="btn small" data-act="bail" data-id="'+esc(l.id)+'">Contrat</button><button class="btn small" data-act="edit-loc" data-id="'+esc(l.id)+'">Modifier</button><button class="btn small" data-act="end-loc" data-id="'+esc(l.id)+'">Fin de bail</button>')+'<button class="btn small danger" data-act="del-loc" data-id="'+esc(l.id)+'">Supprimer</button></td></tr>').join("")+"</table></div>":empty("Aucun locataire enregistré."))+"</section>";
}
function vPay(){
  const ps=list("paiements").sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.numero).localeCompare(String(a.numero)));
  return head("Paiements et reçus","Chaque paiement enregistré produit un reçu numéroté",'<button class="btn primary" data-act="pay">Encaisser un loyer</button>')+
  '<section class="panel">'+(ps.length?'<div class="scroll"><table><tr><th>N° reçu</th><th>Date</th><th>Locataire</th><th>Période</th><th>Mode</th><th class="num">Montant</th><th></th></tr>'+ps.map(p=>"<tr><td>"+esc(p.numero)+"</td><td>"+esc(dateFr(p.date))+"</td><td>"+esc(p.locataireNom)+'<span class="sub">'+esc(p.bienNom)+"</span></td><td>"+esc(moisLabel(p.mois))+"</td><td>"+esc(p.mode)+'</td><td class="num"><b>'+esc(money(p.montant))+'</b></td><td class="act"><button class="btn small primary" data-act="pdf-recu" data-id="'+esc(p.id)+'">Télécharger</button><button class="btn small" data-act="recu" data-id="'+esc(p.id)+'">Voir</button><button class="btn small danger" data-act="del-pay" data-id="'+esc(p.id)+'">Annuler</button></td></tr>').join("")+"</table></div>":empty("Aucun paiement enregistré."))+"</section>";
}
function vMnt(){
  const all=list("maintenance"),f=UI.mntFilter;
  const ms=all.filter(x=>f==="tous"||(f==="ouverts"?x.statut!=="termine":x.statut==="termine")).sort((a,b)=>(a.priorite==="urgente"?0:1)-(b.priorite==="urgente"?0:1)||String(b.date).localeCompare(String(a.date)));
  const chip=(v,t)=>'<button class="chip" data-act="mnt-filter" data-id="'+v+'" aria-pressed="'+(f===v)+'">'+t+"</button>";
  return head("Maintenance","Pannes, réparations et travaux des maisons",'<button class="btn primary" data-act="add-mnt">Nouvelle demande</button>')+
  '<section class="panel"><header><div class="chips">'+chip("ouverts","À traiter ("+all.filter(x=>x.statut!=="termine").length+")")+chip("termines","Terminées")+chip("tous","Toutes")+"</div></header>"+(ms.length?'<div class="scroll"><table><tr><th>Problème</th><th>Maison</th><th>Priorité</th><th>État</th><th>Prestataire</th><th class="num">Coût</th><th></th></tr>'+ms.map(x=>"<tr><td>"+esc(x.titre)+'<span class="sub">'+esc(dateFr(x.date))+(x.description?" · "+esc(x.description):"")+"</span></td><td>"+esc(bienNom(x.bienId))+"</td><td>"+prioPill(x.priorite)+'</td><td><select class="inline" data-chg="mnt-statut" data-id="'+esc(x.id)+'" aria-label="État">'+Object.entries(MNT_STATUTS).map(([k,v])=>'<option value="'+k+'"'+(x.statut===k?" selected":"")+">"+v+"</option>").join("")+"</select></td><td>"+esc(x.prestataire||"—")+'</td><td class="num">'+(x.cout?esc(money(x.cout)):"—")+'<span class="sub">'+esc(CHARGE[x.aCharge||"proprietaire"])+'</span></td><td class="act"><button class="btn small" data-act="edit-mnt" data-id="'+esc(x.id)+'">Modifier</button><button class="btn small danger" data-act="del-mnt" data-id="'+esc(x.id)+'">Supprimer</button></td></tr>').join("")+"</table></div>":empty("Aucune intervention dans cette liste."))+"</section>";
}
function vParam(){
  const c=S.config;
  return head("Paramètres","Informations imprimées sur les reçus et règles de calcul",'<button class="btn primary" data-act="edit-config">Modifier</button>')+
  '<section class="panel"><div class="scroll"><table><tr><th>Nom de l\'agence</th><td>'+esc(c.nom)+"</td></tr><tr><th>Adresse</th><td>"+esc(c.adresse||"—")+"</td></tr><tr><th>Téléphone</th><td>"+esc(c.telephone||"—")+"</td></tr><tr><th>Devise</th><td>"+esc(c.devise)+"</td></tr><tr><th>Commission agence</th><td>"+esc(c.commission)+" % des loyers encaissés</td></tr></table></div></section>"+exBanner();
}

const ROUTES={agence:vAgence,proprietaires:vProp,biens:vBiens,locataires:vLoc,contrats:vContrats,paiements:vPay,maintenance:vMnt,parametres:vParam};
let raf=0;
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  const r=ROUTES[location.hash.slice(1)]?location.hash.slice(1):"agence";
  document.querySelectorAll("nav a").forEach(a=>a.dataset.r===r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#brandSub").textContent=S.config.nom;
  $("#nBiens").textContent=list("biens").length||"";$("#nLoc").textContent=list("locataires").filter(l=>l.actif!==false).length||"";$("#nMnt").textContent=mntOpen().length||"";
  $("#view").className="v-"+r;
  $("#view").innerHTML=ROUTES[r]();
})}
addEventListener("hashchange",render);
dlg.addEventListener("close",()=>dlg.classList.remove("wide"));

/* ---------- téléchargements ---------- */
const slug=t=>String(t||"").replace(/\s*\(exemple\)$/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"document";
async function saveFile(name,make){
  if(!window.jspdf){toast("L'outil de création des PDF ne s'est pas chargé. Vérifiez la connexion puis rouvrez la page.");return}
  try{
    const blob=make(),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("Fichier téléchargé : "+name);
  }catch(e){toast("Le téléchargement n'a pas abouti. Réessayez dans un instant.")}
}
function pdfReleve(){
  const p=S.proprietaires[UI.prop],m=UI.moisProp,r=releve(UI.prop,m),c=S.config;
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape"}),L=14,R=283;let y=18;
  const X=[163,187,211,235,259,283],K=["loyer","enc","reste","com","mnt","net"];
  const cut=(t,w)=>d.splitTextToSize(String(t||""),w)[0]||"";
  const page=()=>{if(y>190){d.addPage();y=18;entete()}};
  const entete=()=>{d.setFillColor(18,40,58);d.rect(L,y-5,R-L,8,"F");d.setTextColor(255);d.setFont("helvetica","bold");d.setFontSize(8.5);
    d.text("Maison / appartement",L+2,y);d.text("Locataire",88,y);["Loyer","Encaissé","Reste dû","Commission","Maintenance","Net"].forEach((t,i)=>d.text(t,X[i]-1,y,{align:"right"}));d.setTextColor(20);y+=8};
  const ligne=(label,loc,vals,o)=>{page();o=o||{};
    if(o.fill){d.setFillColor(...o.fill);d.rect(L,y-4.6,R-L,6.6,"F")}
    d.setFont("helvetica",o.bold?"bold":"normal");d.setFontSize(9);d.setTextColor(...(o.color||[20,20,20]));
    d.text(cut(label,70-(o.indent||0)),L+2+(o.indent||0),y);if(loc)d.text(cut(loc,50),88,y);
    if(vals)vals.forEach((v,i)=>d.text(num(v),X[i]-1,y,{align:"right"}));
    d.setDrawColor(215);d.setLineWidth(.1);d.line(L,y+2,R,y+2);y+=6.6};
  const vals=x=>K.map(k=>x[k]),somme=xs=>K.map(k=>xs.reduce((a,x)=>a+x[k],0));
  const LW=34,LH=LW/LOGO_R,TX=L+LW+4;
  try{d.addImage(LOGO,"JPEG",L,8,LW,LH)}catch(e){}
  d.setFont("helvetica","bold");d.setFontSize(15);d.text(String(c.nom),TX,y);
  d.setFontSize(13);d.text("RELEVÉ DE GESTION — "+moisLabel(m).toUpperCase(),R,y,{align:"right"});
  d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(90);y+=5;
  d.text([c.adresse,c.telephone].filter(Boolean).join(" · "),TX,y);d.text("Édité le "+dateFr(today())+" · montants en "+c.devise,R,y,{align:"right"});
  y=Math.max(y+3,8+LH+3);d.setDrawColor(13,122,107);d.setLineWidth(.7);d.line(L,y,R,y);y+=8;
  d.setTextColor(20);d.setFont("helvetica","bold");d.setFontSize(11);d.text("Propriétaire : "+String(p.nom).replace(/\s*\(exemple\)$/,""),L,y);
  d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(90);const ci=[p.telephone,p.email,p.adresse].filter(Boolean).join(" · ");if(ci){y+=5;d.text(cut(ci,R-L),L,y)}
  y+=10;entete();
  groupes(r.rows).forEach(g=>{
    if(!g.ch.length){ligne(g.t.b.nom,g.t.l?g.t.l.nom:"Vacant",vals(g.t));return}
    const own=g.t.l||g.t.enc||g.t.mnt,xs=(own?[g.t]:[]).concat(g.ch);
    ligne(g.t.b.nom+" · "+g.ch.length+" appartement(s)","",null,{bold:1,fill:[214,236,232]});
    xs.forEach(x=>ligne(x===g.t?"Villa entière / parties communes":x.b.nom,x.l?x.l.nom:"Vacant",vals(x),{indent:5}));
    ligne("Total "+g.t.b.nom,"",somme(xs),{bold:1,fill:[238,241,244]});
  });
  ligne("TOTAL GÉNÉRAL","",somme(r.rows),{bold:1,fill:[18,40,58],color:[255,255,255]});
  if(y>160){d.addPage();y=22}
  y+=8;d.setTextColor(20);
  [["Total encaissé",r.enc],["Commission agence ("+(+c.commission||0)+" %)",-r.com],["Maintenance à la charge du propriétaire",-r.mnt]].forEach(([t,v])=>{d.setFont("helvetica","normal");d.setFontSize(10);d.text(t,180,y);d.text(num(v)+" "+c.devise,R,y,{align:"right"});y+=6});
  d.setFillColor(13,122,107);d.rect(178,y-4.8,R-178,8,"F");d.setTextColor(255);d.setFont("helvetica","bold");d.setFontSize(11);d.text("Net à reverser",180,y+.6);d.text(money(r.net),R-1,y+.6,{align:"right"});
  d.setTextColor(90);d.setFont("helvetica","normal");d.setFontSize(9);d.text("Pour l'agence (signature et cachet)",L,y-8);d.setDrawColor(170);d.setLineWidth(.2);d.line(L,y+8,L+60,y+8);
  return d.output("blob");
}

/* ---------- actions ---------- */
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Texte copié. Collez-le dans WhatsApp ou un e-mail.")}catch(e){toast("La copie n'a pas fonctionné dans cet affichage.")}}
const ACT={
  close:()=>dlg.close(),
  "add-prop":()=>formProp(),"edit-prop":id=>formProp(id),
  "del-prop":id=>list("biens").some(b=>b.proprietaireId===id)?toast("Ce propriétaire a encore des maisons. Supprimez-les ou changez leur propriétaire d'abord."):confirmBox("Supprimer ce propriétaire ?","Supprimer",()=>del("proprietaires",id)),
  "add-bien":id=>formBien(null,id),"edit-bien":id=>formBien(id),
  "del-bien":id=>kids(id).length?toast("Cette villa contient des appartements. Supprimez-les ou détachez-les d'abord."):tenantOf(id)?toast("Cette maison est occupée. Mettez fin au bail avant de la supprimer."):confirmBox("Supprimer cette maison ? Les paiements déjà enregistrés sont conservés.","Supprimer",()=>del("biens",id)),
  "add-loc":()=>formLoc(),"edit-loc":id=>formLoc(id),
  "end-loc":id=>confirmBox("Mettre fin au bail de "+S.locataires[id].nom+" aujourd'hui ? La maison redevient vacante.","Terminer le bail",()=>put("locataires",id,{...S.locataires[id],actif:false,fin:today()})),
  "del-loc":id=>confirmBox("Supprimer ce locataire ? Ses reçus restent dans l'historique.","Supprimer",()=>del("locataires",id)),
  bail:id=>showContrat(id),"edit-bail":id=>formBail(id),
  "copy-bail":id=>copy(contratTexte(contrat(id))),
  "pdf-bail":id=>{const k=contrat(id);if(k)saveFile("contrat-bail-"+slug(k.nom)+".pdf",()=>pdfContrat(k))},
  pay:id=>formPay(id),recu:id=>showRecu(id),
  "del-pay":id=>confirmBox("Annuler le paiement "+(S.paiements[id].numero||"")+" ? Le reçu sera supprimé.","Annuler le paiement",()=>del("paiements",id)),
  "copy-recu":id=>copy(recuTexte(recuData(id))),
  "pdf-recu":id=>{const r=recuData(id);if(r)saveFile("recu-"+r.numero+".pdf",()=>pdfRecu(r))},
  "pdf-releve":()=>{const p=S.proprietaires[UI.prop];if(p)saveFile("releve-"+slug(p.nom)+"-"+UI.moisProp+".pdf",()=>pdfReleve())},
  "copy-releve":()=>copy(releveTexte()),
  "add-mnt":id=>{formMnt();if(id&&$("#f-bienId"))$("#f-bienId").value=id},"edit-mnt":id=>formMnt(id),
  "del-mnt":id=>confirmBox("Supprimer cette intervention ?","Supprimer",()=>del("maintenance",id)),
  "mnt-filter":id=>{UI.mntFilter=id;render()},
  "edit-config":()=>formConfig(),
  "del-exemples":()=>confirmBox("Supprimer toutes les données d'exemple ? Vos propres saisies sont conservées.","Supprimer les exemples",async()=>{for(const c of COLS)for(const d of list(c))if(d.exemple)await del(c,d.id);toast("Exemples supprimés.")})
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act]){ACT[b.dataset.act](b.dataset.id)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="selProp"){UI.prop=t.value;render()}
  else if(t.id==="selMois"&&t.value){UI.moisProp=t.value;render()}
  else if(t.dataset.chg==="mnt-statut"){const x=S.maintenance[t.dataset.id];if(x)put("maintenance",t.dataset.id,{...x,statut:t.value}).catch(()=>render())}
});
document.querySelectorAll("img[data-logo]").forEach(i=>{i.src=LOGO});
$("#logout").onclick=()=>{
  if(!auth)return;
  confirmBox("Se déconnecter de la plateforme ?","Se déconnecter",async()=>{
    couper();try{await auth.signOut()}catch(e){toast("Déconnexion impossible pour le moment.")}
  });
};
render();init();
</script>
